<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>D2 MOBIUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090d; --panel: #10151f; --panel2: #18202e; --line: #2a3448; --text: #e8ebf0; --muted: #8a95aa;
  --accent: #ff9a1e; --good: #6ee07a; --bad: #ff5d5d;
  --arc: #79bbff; --solar: #ff8a1e; --void: #b084eb; --stasis: #4d88ff; --strand: #5fd970; --light: #f3ecd0; --kin: #d4d4d4; --prism: #ff6bd5;
  --tier5: #a070d8; --tier6: #e8c33a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: 'DotGothic16', 'Hiragino Kaku Gothic ProN', monospace; -webkit-font-smoothing: none; overflow-x: hidden; }
button { font-family: inherit; cursor: pointer; color: inherit; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- common ---------- */
.pbtn {
  background: var(--panel2); border: 2px solid var(--line); padding: 8px 14px; font-size: 14px;
  box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35), inset 2px 2px 0 rgba(255,255,255,0.06);
}
.pbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.pbtn.primary { background: var(--accent); color: #140b00; border-color: #ffc070; }
.pbtn.primary:hover:not(:disabled) { color: #140b00; filter: brightness(1.1); }
.pbtn.small { padding: 4px 8px; font-size: 12px; }
.panel { background: var(--panel); border: 2px solid var(--line); padding: 10px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
h2.sec { font-size: 14px; color: var(--accent); margin: 14px 0 6px; letter-spacing: 2px; font-weight: normal; }
h2.sec::before { content: '▶ '; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.err { color: var(--bad); white-space: pre-line; }

/* ---------- title ---------- */
.title-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 30px 16px; text-align: center; }
.title-screen h1 { font-size: 40px; margin: 0; letter-spacing: 6px; color: var(--accent); text-shadow: 3px 3px 0 #3a1c00; font-weight: normal; }
.title-screen .sub { color: var(--muted); letter-spacing: 3px; }
.title-screen canvas { width: 288px; height: 96px; }
.class-pick { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.class-pick button { width: 120px; padding: 10px 6px; }
.class-pick canvas { width: 72px; height: 72px; display: block; margin: 0 auto 4px; }

/* ---------- hub ---------- */
.hub-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 2px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.hub-head .logo { color: var(--accent); letter-spacing: 3px; }
.glimmer { display: flex; align-items: center; gap: 4px; color: #bfe9ff; }
.glimmer img { width: 18px; height: 18px; }
.tabs { display: flex; border-bottom: 2px solid var(--line); background: var(--panel); overflow-x: auto; }
.tabs button { flex: 1; min-width: 72px; background: none; border: 0; padding: 10px 4px; font-size: 13px; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.hub-body { padding: 12px; flex: 1; }
.job-banner { display: flex; gap: 10px; align-items: center; }
.job-banner canvas { width: 72px; height: 72px; background: rgba(255,255,255,0.03); border: 2px solid var(--line); }

/* stage list */
.stage { display: flex; gap: 10px; align-items: center; padding: 8px; border: 2px solid var(--line); background: var(--panel); margin-bottom: 6px; cursor: pointer; }
.stage:hover { border-color: var(--accent); }
.stage.locked { opacity: 0.4; cursor: not-allowed; }
.stage .thumb { width: 96px; height: 54px; flex-shrink: 0; background: #000; }
.stage .no { color: var(--accent); font-size: 12px; }
.stage .nm { font-size: 15px; }
.stage .info { font-size: 11px; color: var(--muted); }
.stage .clear { color: var(--good); font-size: 11px; }

/* job editor */
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.opt { display: flex; gap: 6px; align-items: center; padding: 6px; border: 2px solid var(--line); background: var(--panel2); cursor: pointer; text-align: left; font-size: 12px; }
.opt img { width: 32px; height: 32px; flex-shrink: 0; background: #000; }
.opt.sel { border-color: var(--accent); background: rgba(255,154,30,0.12); }
.opt .d { font-size: 10px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.job-card { display: flex; gap: 8px; align-items: center; padding: 8px; border: 2px solid var(--line); background: var(--panel); margin-bottom: 6px; }
.job-card.active { border-color: var(--accent); }
.stars { letter-spacing: -1px; font-size: 12px; }
.stars.r3 { color: #8fd0ff; } .stars.r4 { color: #c39af5; } .stars.r5 { color: #f0c94a; text-shadow: 0 0 6px rgba(240,201,74,0.6); }
.job-card .abil { display: flex; gap: 3px; }
.job-card .abil img { width: 24px; height: 24px; background: #000; }
input.txt { background: var(--panel2); border: 2px solid var(--line); color: var(--text); padding: 6px 8px; font-family: inherit; font-size: 14px; }

/* gear */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.slot { display: flex; gap: 8px; align-items: center; padding: 6px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; min-height: 56px; }
.slot:hover { border-color: var(--accent); }
.slot img { width: 44px; height: 44px; background: #000; flex-shrink: 0; }
.slot .lbl { font-size: 10px; color: var(--muted); }
.slot .nm { font-size: 13px; }
.slot .nm.t6 { color: var(--tier6); } .slot .nm.t5 { color: var(--tier5); }
.statline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; font-size: 12px; }
.statline span.v { color: var(--accent); float: right; }
.setfx { font-size: 12px; padding: 6px 8px; border: 2px dashed var(--line); margin-top: 6px; }
.setfx.on { border-color: var(--good); color: var(--good); }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; max-height: 50vh; overflow-y: auto; }
.picker .it { position: relative; cursor: pointer; border: 2px solid var(--line); background: #000; }
.picker .it img { width: 100%; display: block; }
.picker .it.t6 { border-color: var(--tier6); } .picker .it.t5 { border-color: var(--tier5); }
.picker .it .src { position: absolute; top: 1px; left: 2px; font-size: 9px; background: rgba(0,0,0,0.7); padding: 0 2px; }

/* gacha */
.engram { text-align: center; padding: 16px; }
.engram canvas { width: 96px; height: 96px; }
.pull-res { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.pull-res .it { border: 2px solid var(--line); background: #000; animation: pop 300ms ease-out both; }
.pull-res .it img { width: 100%; display: block; }
.pull-res .it.t6 { border-color: var(--tier6); box-shadow: 0 0 10px var(--tier6); }
.pull-res .it.t5 { border-color: var(--tier5); }
.pull-res .it .n { font-size: 9px; padding: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- dialog (story) ---------- */
.dialog { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0,0,0,0.55); }
.dialog .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; z-index: -1; }
.dialog .box { max-width: 720px; width: 100%; margin: 0 auto 16px; background: rgba(10,14,22,0.94); border: 3px solid var(--line); padding: 12px 14px; min-height: 120px; cursor: pointer; position: relative; }
.dialog .spk { color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.dialog .spk canvas { width: 32px; height: 32px; }
.dialog .txt { line-height: 1.7; font-size: 15px; white-space: pre-wrap; }
.dialog .next { position: absolute; right: 10px; bottom: 6px; animation: blink 0.8s steps(2) infinite; color: var(--accent); }
.dialog .skip { position: absolute; right: 8px; top: -34px; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- battle ---------- */
.battle { flex: 1; display: flex; flex-direction: column; }
.battle .bhead { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; background: var(--panel); border-bottom: 2px solid var(--line); }
.battle canvas#bc { width: 100%; aspect-ratio: 16/9; display: block; background: #000; cursor: crosshair; touch-action: manipulation; }
.hud { padding: 8px 10px; background: var(--panel); border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.bar { position: relative; height: 14px; background: #000; border: 2px solid var(--line); }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--good); transition: width 200ms; }
.bar.super > i { background: linear-gradient(90deg, #ffe08a, var(--accent)); }
.bar > span { position: absolute; inset: 0; font-size: 10px; line-height: 10px; text-align: center; text-shadow: 1px 1px 0 #000; }
.orbs { display: flex; gap: 3px; flex-wrap: wrap; min-height: 18px; }
.orb { width: 14px; height: 14px; transform: rotate(45deg); border: 2px solid #000; box-shadow: 0 0 4px currentColor; }
.orb.empty { background: transparent !important; border-color: var(--line); box-shadow: none; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.card {
  display: flex; gap: 5px; align-items: center; padding: 4px; text-align: left; font-size: 11px; min-height: 48px;
  background: var(--panel2); border: 2px solid var(--line); position: relative;
}
.card img { width: 32px; height: 32px; background: #000; flex-shrink: 0; }
.card .cn { line-height: 1.2; max-height: 2.4em; overflow: hidden; }
.card .cost { display: flex; gap: 2px; margin-top: 2px; }
.card .cost i { width: 8px; height: 8px; transform: rotate(45deg); border: 1px solid #000; display: inline-block; }
.card:not(:disabled):hover { border-color: var(--accent); }
.card:disabled { opacity: 0.35; cursor: not-allowed; }
.card.ready { border-color: var(--accent); }
.superbtn { width: 100%; padding: 8px; font-size: 15px; letter-spacing: 3px; }
.superbtn.ready { animation: glow 0.9s ease-in-out infinite alternate; background: var(--accent); color: #150b00; border-color: #ffd28a; }
@keyframes glow { from { box-shadow: 0 0 2px var(--accent); } to { box-shadow: 0 0 14px var(--accent); } }
.blog { font-size: 11px; color: var(--muted); height: 2.8em; overflow: hidden; line-height: 1.4; }
.result { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
.result .panel { max-width: 420px; width: 100%; text-align: center; }
.result h3 { font-size: 26px; margin: 6px 0 10px; color: var(--accent); font-weight: normal; letter-spacing: 4px; }
.result .drops { display: flex; gap: 6px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
.result .drops img { width: 56px; height: 56px; border: 2px solid var(--tier5); }
.result .drops img.t6 { border-color: var(--tier6); }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel); border: 2px solid var(--accent); padding: 8px 14px; z-index: 99; opacity: 0; transition: opacity 200ms; pointer-events: none; font-size: 13px; }
#toast.show { opacity: 1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 12px; }
.modal .panel { max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; }
@media (max-width: 480px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .title-screen h1 { font-size: 30px; }
}
</style>
</head>
<body>
<div id="app"><div class="loading">初期化中...</div></div>
<div id="toast"></div>
<script src="../manifest-trim.js"></script>
<script src="sprites.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
