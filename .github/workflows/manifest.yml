name: Update manifest

# Rebuilds data/manifest-ja.json when Bungie publishes a new manifest version.
# The browser loads this compact file (~2.5MB gzip) instead of the raw ~200MB definitions.
on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the manifest version is unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - manifest-trim.js
      - tools/build-manifest.js

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build compact manifest
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: node --max-old-space-size=4096 tools/build-manifest.js ${{ (github.event_name == 'push' || inputs.force) && '--force' || '' }}
      - name: Commit if changed
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update manifest $(node -p "require('./data/manifest-version.json').version")"
          git push
